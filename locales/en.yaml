    min {low} / median {mid} / max {high}
    blocked by the current threshold: {blocked}
  gate_empty: "Giveaway #{id} has no eligible participants yet."

# Wizard for /newgiveaway.  Steps are numbered so an admin can see where
# they are; the draft lives in FSM state until the final "ok".
fsm:
  enter_title: "Giveaway title (1/9):"
  enter_description: "Description (2/9), or - to skip:"
  enter_prizes: |
    Prize tiers (3/9), one per line:
    name: count
    e.g.
    Steam card: 2
    R&D key: 1
  bad_prizes: |
    Could not parse that.  Every line must look like "name: count",
    for example "Steam card: 2".
  enter_channels: |
    Required channels (4/9), one @channel per line,
    or - to skip.  The bot must already be an administrator of every channel
    you list, and members are checked at join time.
  bad_channels: |
    The bot cannot use these channels — add it as an admin first:
    {channels}
  enter_duration: "Ends at (5/9): a duration like 2h / 3d / 1w, or an absolute time:"
  bad_duration: Could not read that time. Try "30m", "6h", "3d" or "2026-01-31 20:00".
  enter_turnstile: "Require a Cloudflare Turnstile captcha for joining? (6/9) yes/no:"
  enter_prizemode: |
    How should the prize be delivered? (7/9)
    1 = a unique code per winner, 2 = one text shared by all, 0 = deliver manually
  bad_prizemode: Please answer 1 (unique codes), 2 (shared text) or 0 (manual).
  enter_codes_unique: |
    Enter the "{tier}" prizes (8/9), one per line — {count} needed,
    extras are kept in stock.  Send - to skip and top up later with /addcodes.
  enter_codes_shared: |
    Enter the shared "{tier}" text (8/9).  The next message is sent to every
    winner verbatim.  Send - to skip.
  bad_codes: Nothing usable received — paste one prize per line, or send - to skip.
  codes_short: |
    ⚠️ Only {count} received, but {needed} are needed.
    Continuing anyway; use /addcodes to top up before the draw.
  mode_unique: a unique code per winner
  mode_shared: one text shared by everybody
  mode_none: delivered manually by the host
  enter_target: "Post it where (9/9): forward a channel post, or send @channel or the chat id:"
  bad_target: "Could not resolve that target. Forward a message from the channel, or send @channel."
  confirm: |
    Please check:
    Title: {title}
    Prizes: {prizes}
    Channels: {channels}
    Ends at: {ends_at}
    Captcha: {turnstile}
    Prize delivery: {prizemode}
    Post to: {target}
    Send "ok" to publish, or /cancel to abort.
  saved: "✅ Giveaway published. Keep this message for controls:"
