  usage_cancel: "usage: /cancel <id>"
  usage_reroll: "usage: /reroll <id> <tier_name>"
  usage_ban: "usage: /ban <user_id> [reason]"
  usage_unban: "usage: /unban <user_id>"
  usage_addadmin: "usage: /addadmin <user_id>"
  usage_retry: "usage: /retry <giveaway_id>"
  retry_ok: "#{id}: delivered {count} pending winner message(s)."
  cancel_ok: "❌ Giveaway #{id} has been canceled."
  cancel_missing: "#{id} is not running, or it does not exist."
  reroll_ok: "🎲 #{id} / {tier}: {count} new winner(s)."
  reroll_running: "#{id} is still running — reroll only works after it has finished."
  reroll_canceled: "#{id} was canceled, so there is nothing to re-draw."
  reroll_no_tier: "Giveaway #{id} has no tier called {tier}."
  reroll_empty: "#{id} / {tier}: nobody eligible is left to win."
  ban_ok: "🚫 {user_id} banned. Removed from {n} giveaway entry(ies)."
  ban_ok_none: "🚫 {user_id} banned. No active entries to remove."
  unban_ok: "✅ {user_id} removed from the blacklist."
  addadmin_ok: "✅ {user_id} is now an admin."
  turnstile_not_configured: |
    ⚠️ Turnstile is not configured on this deployment
    (TURNSTILE_ENABLED / TURNSTILE_SITE_KEY / TURNSTILE_SECRET_KEY, plus
