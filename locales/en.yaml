# =============================================================================
# English localization / 英文文案
# Every key must also exist in zh.yaml - a test enforces parity.
# -----------------------------------------------------------------------------
# Placeholders / 占位符:
#   {title} {id} {count} {tier} {channels} {ends_at} {prizes} {target} {url}
#   {requested} {granted} {missing} {user_id} {status} {reason} {n}
#
# Values are rendered as Telegram HTML (ParseMode.HTML).  Every value that
# is interpolated goes through bot.utils.esc.esc() first, so an admin title
# like "R&D key" can no longer break entity parsing.
# =============================================================================

start:
  welcome: |
    👋 Welcome to the Giveaway Bot!
    Send /help for the command list.
  help: |
    📖 Commands

    • /start — Welcome
    • /help — This help
    • /lang — Switch language (zh / en)
    • /me — Giveaways I joined

    Admin commands (admins only)
    • /newgiveaway — Create a new giveaway
    • /list — All running giveaways
    • /cancel <id> — Cancel a giveaway
    • /reroll <id> <tier> — Re-draw a finished tier
    • /retry <id> — Retry undelivered winner messages
    • /ban <user_id> [reason] — Blacklist a user (removes their entries)
    • /unban <user_id> — Remove from blacklist
    • /addadmin <user_id> — Promote a user to admin
  lang_prompt: "Please choose a language / 请选择语言:"
  lang_set: "✅ Language set to {language}."
  lang_unchanged: "Your language is already {language}."
  me_empty: You haven't joined any giveaways yet.
  me_header: "Your recent giveaways (last {count}):"
  me_row: "• #{id} {title} — status: {status}"

common:
  cancel: Canceled.
  not_admin: "❌ You are not an admin."
  in_private_only: Please use this command in a private chat with the bot.
  unknown_error: "Something went wrong, please retry later."
  admin_only_hint: "Send /help to see what is available to you."

button:
  join: "✅ Join"
  joined: "✅ Joined"
  verify: "🛡 Verify"
  open_channel: "🔗 Open channel"
  refresh: "🔄 Refresh"
  open_bot: "Open the bot"
  claim: "🎁 Claim prize"

join:
  ok: "🎉 You're in! Good luck."
  already: You've already joined this giveaway.
  banned: You are blacklisted from this giveaway.
  not_member: |
    Please join the following channels first:
    {channels}
  ended: This giveaway has ended.
  need_verify: "Please complete the captcha first:\n{url}"
  need_verify_prompt: Solve the captcha below, then come back to the bot.
  verify_no_token: The captcha response was empty. Please try again.
  verify_failed: The captcha could not be verified. Please try again.
  verify_ok: "✅ Captcha passed."
  verify_return: Now press the button below to return to the bot and join.
  verify_return_no_link: Return to the bot and press the join button again.
  verify_expired: This verification link has expired. Please request a new one.
  verify_sent: The verification button has been sent to your private chat with the bot.
  open_bot_first: Open the bot, send /start, then press Join again to receive the verification link.
  verify_rate_limited: Too many requests - please wait a minute and try again.
  too_new: |
    ⚠️ This Telegram account is too new to enter this giveaway.
    The host turned on the throwaway-account filter; please use an older account.
  verify_join_prompt: "✅ Captcha passed. Press Join below to complete your entry."

giveaway:
  running_header: "🎁 Giveaway #{id} — running"
  finished_header: "🏁 Giveaway #{id} — finished"
  reroll_header: "🎲 Giveaway #{id} — tier re-drawn"
  canceled: "❌ Giveaway #{id} has been canceled."
  no_participants: No participants — giveaway voided.
  no_winners: No eligible winners for this draw.
  winners_header: "Winners:"
  winner_line: "• {tier}: {mention}"
  tier_short: |
    ⚠️ {tier}: only {granted} of {requested} prize(s) could be awarded
       ({missing} shortfall). Not enough eligible participants.
  count_label: "{count} joined"
  ends_label: "Ends at: {ends_at}"
  prizes_label: "Prizes:\n{prizes}"
  reveal_line: |
    🔐 Verifiable draw (round {round})
    seed: {seed}
    sha256(seed): {commit}
    participant snapshot: {digest}
    See "verifiable draw" in the README for the replay recipe.

winner_dm:
  body: |
    🎉 Congrats! You won at "{title}".
    Tier: {tier}
    The host will follow up shortly, or DM {creator}.
  body_claim: |
    🎉 Congrats! You won at "{title}".
    Tier: {tier}
    Press the "🎁 Claim prize" button below to receive it — /claim and
    /myprizes work too.
  host: "the host (ID: {id})"

# Self-service prize delivery.  A prize is either a unique code per winner
# ("unique") or one shared text for everybody ("shared").  {code} is sent
# verbatim, so keep markup-sensitive characters out of it.
prize:
  claimed: "🎁 Here is your prize:\n\n{code}"
  empty: |
    ⚠️ This tier is out of stock right now.
    The host has been notified; press the button again once they top it up.
  already: You already claimed this tier — send /myprizes to see it again.
  not_winner: Only winners of this tier can claim it.
  none_mode: This giveaway does not deliver prizes automatically.
  unknown: No such giveaway — it may have been deleted.
  claim_usage: "usage: /claim <giveaway_id>"
  stock_alert: |
    ⚠️ Giveaway #{id} has run out of "{tier}" prizes, so winners cannot claim.
    Top it up with /addcodes {id} {tier}
  myprizes_empty: You haven't claimed any prizes yet.
  myprizes_header: "🎁 Prizes you have claimed ({count}):"
  myprizes_row: |
    #{id} {title} — {tier}
    {code}
  stock_header: "📦 Stock of giveaway #{id}:"
  stock_row: "• {tier}: total {total} / claimed {claimed} / left {remaining}"
  stock_empty: Giveaway #{id} has no prize stock yet.
  status_usage: "usage: /prizestatus <giveaway_id>"
  addcodes_usage: "usage: /addcodes <giveaway_id> <tier_name>"
  addcodes_prompt: |
    Send me the "{tier}" prizes, one per line.  Send - when you're done.
  addcodes_ok: '✅ Added {count} prize(s) to "{tier}".'
  addcodes_empty: Nothing received — paste one prize per line, or send - to finish.
  addcodes_unknown_tier: "Giveaway #{id} has no tier called {tier}. Known tiers: {tiers}"

