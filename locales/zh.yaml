  addadmin_ok: "✅ 已将 {user_id} 设为管理员。"
  turnstile_not_configured: |
    ⚠️ 当前部署没有配置人机验证
    (需 TURNSTILE_ENABLED / TURNSTILE_SITE_KEY / TURNSTILE_SECRET_KEY,
    以及供用户打开验证页面的 PUBLIC_BASE_URL)。
    请配置人机验证,或回答「否」以继续创建。
