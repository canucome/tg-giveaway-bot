    当前阈值下会被挡掉:{blocked} 人
  gate_empty: "抽奖 #{id} 还没有合格参与者。"

# /newgiveaway 向导。每个步骤带序号,草稿保存在 FSM 状态中,
# 直到最后一步输入 "ok" 才会真正创建。
fsm:
  enter_title: "抽奖标题 (1/9):"
  enter_description: "抽奖说明 (2/9),发送 - 可跳过:"
  enter_prizes: |
    奖项设置 (3/9),每行一个,格式为「名称:数量」,例如:
    Steam 礼品卡: 2
    内测兑换码: 1
  bad_prizes: |
    无法解析。每行都需要是「名称:数量」,
    例如「Steam 礼品卡: 2」。
  enter_channels: |
    要求加入的频道 (4/9),每行一个 @频道,
    发送 - 可跳过。机器人必须已经是所列频道的管理员,
    报名时会实时校验订阅状态。
  bad_channels: |
    机器人无法使用以下频道,请先把它设为管理员:
    {channels}
  enter_duration: "结束时间 (5/9):可填 30m / 6h / 3d 这样的时长,或填具体时间:"
  bad_duration: "无法识别该时间,请填写「30m」「6h」「3d」或「2026-01-31 20:00」。"
  enter_turnstile: "是否要求报名者通过 Cloudflare Turnstile 人机验证?(6/9) 是/否:"
  enter_prizemode: |
    奖品怎么发?(7/9)
    1 = 每人一条独立码,2 = 所有人同一段文本,0 = 不自动发(自己联系中奖者)
  bad_prizemode: 请回答 1(独立码)、2(共享文本)或 0(不自动发)。
  enter_codes_unique: |
    请录入「{tier}」的奖品 (8/9),一行一条,共需 {count} 条,
    超出部分会一起存进奖池。发送 - 跳过,之后可用 /addcodes 补。
  enter_codes_shared: |
    请录入「{tier}」的共享文本 (8/9),下一条消息会原样发给所有中奖者。
    发送 - 跳过。
  bad_codes: 没有收到可用的奖品内容,请一行一条粘贴,或发送 - 跳过。
  codes_short: |
    ⚠️ 只收到 {count} 条,少于中奖名额 {needed} 条。
    仍然继续,发完后可用 /addcodes 补货。
  mode_unique: 每人一条独立码
  mode_shared: 所有人共享同一段文本
  mode_none: 不自动发(主办方自行联系)
  enter_target: "发布到哪里 (9/9):转发频道消息,或发送 @频道 / 数字 chat id:"
  bad_target: "无法定位该目标,请转发频道中的消息,或直接发送 @频道。"
  confirm: |
    请确认:
    标题: {title}
    奖项: {prizes}
    频道: {channels}
    结束时间: {ends_at}
    人机验证: {turnstile}
    发奖方式: {prizemode}
    发布到: {target}
    发送 "ok" 发布,发送 /cancel 放弃。
  saved: "✅ 抽奖已发布,保留本条消息可用于管理:"
