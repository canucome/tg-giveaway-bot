# =============================================================================
# 中文文案 / Chinese localization
# 每个 key 都必须在 en.yaml 中存在,测试会强制两边保持一致。
# -----------------------------------------------------------------------------
# 占位符 / Placeholders:
#   {title} {id} {count} {tier} {channels} {ends_at} {prizes} {target} {url}
#   {requested} {granted} {missing} {user_id} {status} {reason} {n}
#
# 消息以 Telegram HTML(ParseMode.HTML) 发送。所有插入的变量都先经过
# bot.utils.esc.esc() 转义,所以 "R&D key" 这类标题不会再触发
# "can't parse entities" 错误。
# =============================================================================

start:
  welcome: |
    👋 欢迎使用抽奖机器人!
    发送 /help 查看命令列表。
  help: |
    📖 命令列表

    • /start — 欢迎
    • /help — 本帮助
    • /lang — 切换语言 (zh / en)
    • /me — 我参与的抽奖

    管理员命令 (仅管理员)
    • /newgiveaway — 创建新抽奖
    • /list — 全部进行中的抽奖
    • /cancel <id> — 取消抽奖
    • /reroll <id> <tier> — 重抽已结束的奖项
    • /retry <id> — 重试未送达的中奖私信
    • /ban <user_id> [原因] — 拉黑用户(同时清除其报名记录)
    • /unban <user_id> — 解除拉黑
    • /addadmin <user_id> — 添加管理员
  lang_prompt: "请选择语言 / Please choose a language:"
  lang_set: "✅ 已切换为中文。"
  lang_unchanged: "你当前的语言就是中文。"
  me_empty: 你还没有参与过任何抽奖。
  me_header: "最近参与的抽奖(最多 {count} 条):"
  me_row: "• #{id} {title} — 状态:{status}"

common:
  cancel: 已取消。
  not_admin: "❌ 你不是管理员。"
  in_private_only: 请在与机器人的私聊中使用该命令。
  unknown_error: 出了点问题,请稍后再试。
  admin_only_hint: 发送 /help 查看你可以使用的命令。

button:
  join: "✅ 参加"
  joined: "✅ 已参加"
  verify: "🛡 人机验证"
  open_channel: "🔗 打开频道"
  refresh: "🔄 刷新"
  open_bot: "打开机器人"
  claim: "🎁 领取奖品"

join:
  ok: "🎉 报名成功,祝你好运!"
  already: 你已经报名过这个抽奖了。
  banned: 你已被列入黑名单,无法参加。
  not_member: |
    请先加入下列频道再来报名:
    {channels}
  ended: 该抽奖已结束。
  need_verify: "请先完成人机验证:\n{url}"
  need_verify_prompt: 请在下方完成人机验证,然后返回机器人。
  verify_no_token: 没有收到验证结果,请重试。
  verify_failed: 人机验证未通过,请重试。
  verify_ok: "✅ 验证通过。"
  verify_return: 现在点击下方按钮回到机器人并点击参加。
  verify_return_no_link: 请回到机器人重新点击参加按钮。
  verify_expired: 该验证链接已过期,请重新获取。
  verify_sent: 验证按钮已发送到你与机器人的私聊。
  open_bot_first: 请先打开机器人并发送 /start,然后重新点击参加以接收验证链接。
  verify_rate_limited: 请求过于频繁,请等一分钟再试。
  too_new: |
    ⚠️ 你的 Telegram 账号注册时间太新,暂时不能参加这次抽奖。
    这是主办方开启的防小号规则,请用注册较早的账号参加。
  verify_join_prompt: "✅ 验证已通过,请点击下方参加按钮完成报名。"

giveaway:
  running_header: "🎁 抽奖 #{id} — 进行中"
  finished_header: "🏁 抽奖 #{id} — 已结束"
  reroll_header: "🎲 抽奖 #{id} — 奖项已重抽"
  canceled: "❌ 抽奖 #{id} 已取消。"
  no_participants: 无人参与,本次抽奖作废。
  no_winners: 本次开奖没有符合条件的中奖者。
  winners_header: "中奖名单:"
  winner_line: "• {tier}: {mention}"
  tier_short: |
    ⚠️ {tier}:应发 {requested} 份,实际只发出 {granted} 份
       (缺 {missing} 份),符合资格的参与者不足。
  count_label: "已参与 {count} 人"
  ends_label: "结束时间:{ends_at}"
  prizes_label: "奖品:\n{prizes}"
  reveal_line: |
    🔐 可验证开奖(第 {round} 轮)
    seed: {seed}
    sha256(seed): {commit}
    参与者快照: {digest}
    复算方式见 README「可验证开奖」。

winner_dm:
  body: |
    🎉 恭喜!你在 "{title}" 中中奖了。
    奖项:{tier}
    主办方稍后会联系你,也可以直接私信 {creator}。
  body_claim: |
    🎉 恭喜!你在 "{title}" 中奖了。
    奖项:{tier}
    点下面的「🎁 领取奖品」按钮就能拿到奖品,也可以发送 /claim 或 /myprizes。
  host: "主办方(ID:{id})"

# 奖品自助领取。奖品种类只有两种:每人一条独立码(unique),或所有人同一段
# 文本(shared)。文案里的 {code} 会原样发出,注意别放会破坏 HTML 的字符。
prize:
  claimed: "🎁 你的奖品:\n\n{code}"
  empty: |
    ⚠️ 该奖项的奖品暂时发完了。
    已经通知主办方补货,补上之后再点一次按钮即可领取。
  already: 你已经领过这个奖项了,发送 /myprizes 可以重新查看。
  not_winner: 只有中奖者才能领取该奖品。
  none_mode: 这场抽奖没有开启自助领奖。
  unknown: 找不到这场抽奖,可能已被删除。
  claim_usage: "用法:/claim <抽奖id>"
  stock_alert: |
    ⚠️ 抽奖 #{id} 的「{tier}」奖品已经发完,中奖者领不到。
    用 /addcodes {id} {tier} 补货。
  myprizes_empty: 你还没有领取过奖品。
  myprizes_header: "🎁 你已领取的奖品(共 {count} 份):"
  myprizes_row: |
    #{id} {title} — {tier}
    {code}
  stock_header: "📦 抽奖 #{id} 的奖池:"
  stock_row: "• {tier}:共 {total} / 已领 {claimed} / 剩余 {remaining}"
  stock_empty: "抽奖 #{id} 还没有录入任何奖品。"
  status_usage: "用法:/prizestatus <抽奖id>"
  addcodes_usage: "用法:/addcodes <抽奖id> <奖项名>"
  addcodes_prompt: |
    请把「{tier}」的奖品一行一条发给我,发送 - 结束录入。
  addcodes_ok: "✅ 已为「{tier}」录入 {count} 条奖品。"
  addcodes_empty: 没有收到任何内容,请一行一条粘贴奖品,或发送 - 结束。
  addcodes_unknown_tier: "抽奖 #{id} 没有名为「{tier}」的奖项。可选:{tiers}"

admin:
  list_empty: 当前没有进行中的抽奖。
  list_header: "🎁 进行中的抽奖,共 {count} 条:"
